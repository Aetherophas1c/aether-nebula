<div class="tplmod-root" data-tplmod-root>
  <div class="tplmod-header">
    <div class="tplmod-title-group">
      <span class="tplmod-icon" aria-hidden="true">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5Z"></path>
        </svg>
      </span>
      <div>
        <strong class="tplmod-title">示例扩展工作台（Starter Template）</strong>
        <div class="tplmod-subtitle" data-runtime-meta>正在加载宿主信息...</div>
      </div>
    </div>
    <span class="tplmod-badge">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="11" width="18" height="11" rx="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
      <span>数据仅存于加密工作区（Vault）</span>
    </span>
  </div>

  <div class="tplmod-grid">
    <section class="tplmod-card">
      <div class="tplmod-card-head">
        <strong>编辑环境扩展标签</strong>
        <button type="button" class="btn btn-xs" data-action="reload">刷新</button>
      </div>

      <label class="tplmod-label">目标指纹环境</label>
      <select class="select" data-profile-select></select>

      <label class="tplmod-label">短标签（展示在主列表「扩展标签」列）</label>
      <input type="text" class="input" data-tag-input maxlength="32" placeholder="例如：高权重 / 养号中 / 待验活">

      <label class="tplmod-label">补充备注</label>
      <textarea class="textarea tplmod-textarea" rows="3" data-note-input maxlength="240" placeholder="仅保存在当前 Vault 的 SQLite 数据库中..."></textarea>

      <div class="tplmod-actions">
        <button type="button" class="btn btn-primary" data-action="save">保存标签</button>
        <button type="button" class="btn btn-sky" data-action="stamp">快捷打卡</button>
        <button type="button" class="btn btn-danger" data-action="delete">清除标签</button>
      </div>
    </section>

    <section class="tplmod-card">
      <div class="tplmod-card-head">
        <strong>已保存记录</strong>
        <span class="badge badge-slate mono" data-count-badge>0 条</span>
      </div>

      <div class="tplmod-table-wrap">
        <table class="tplmod-table">
          <thead>
            <tr>
              <th>环境</th>
              <th>标签</th>
              <th>打卡</th>
              <th>备注</th>
            </tr>
          </thead>
          <tbody data-tags-tbody>
            <tr>
              <td colspan="4" class="tplmod-empty">正在加载记录...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>
</div>
